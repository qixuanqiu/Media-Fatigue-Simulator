<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Fatigue Simulator: From Inundation to Silence</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            max-width: 800px;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: #64748b;
            font-size: 0.95rem;
        }

        /* 控制栏 & Agency Spectrum */
        .control-panel {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 25px;
        }

        .switch-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }

        .switch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4);
        }

        /* Agency Spectrum Indicator */
        .spectrum-container {
            width: 100%;
            max-width: 800px;
            background-color: #0f172a;
            border-radius: 8px;
            padding: 10px 14px;
            border: 1px solid #334155;
        }

        .spectrum-labels {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .spectrum-btn {
            background-color: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 8px 4px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            line-height: 1.3;
        }

        .spectrum-btn:hover {
            background-color: #334155;
            color: #f8fafc;
            border-color: #64748b;
        }

        .spectrum-btn.active {
            color: #ffffff;
            font-weight: 600;
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.2);
        }

        .spectrum-bar {
            height: 6px;
            background-color: #334155;
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }

        .spectrum-pointer {
            position: absolute;
            top: 0;
            width: 33.33%;
            height: 100%;
            background: #ef4444;
            border-radius: 3px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 主内容容器 */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            width: 100%;
            max-width: 1100px;
        }

        @media (max-width: 850px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 海报高度锁死 */
        .poster-wrapper {
            height: 500px;
            width: 100%;
            background-color: #000000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #334155;
        }

        .poster-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.3s ease;
        }

        .text-card h2 {
            font-size: 1.4rem;
            color: #f8fafc;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            background-color: #7f1d1d;
            color: #fca5a5;
            margin-bottom: 10px;
        }

        .theory-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #cbd5e1;
        }

        .theory-list li strong {
            color: #38bdf8;
            display: block;
            margin-bottom: 2px;
        }

        audio {
            width: 100%;
            margin-top: auto;
            border-radius: 6px;
        }

        /* 策展交互微控件 & 叠加信号样式 */
        .curation-controls {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #334155;
        }

        .signal-btn {
            background-color: #0f172a;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 6px 12px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .signal-btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }

        .signal-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #64748b;
            color: #64748b;
        }

        /* 叠加日志容器 */
        .signal-log-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 8px;
        }

        .signal-log-item {
            font-size: 0.75rem;
            color: #10b981;
            background-color: #064e3b22;
            border-left: 2px solid #10b981;
            padding: 4px 8px;
            border-radius: 2px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-3px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Media Fatigue Simulator</h1>
        <p>An Interactive Exhibition on Algorithmic Inundation and Personal Curation</p>
    </header>

    <div class="control-panel">
        <button id="switchBtn" class="switch-btn">Switch Phase</button>
        
        <!-- Agency Spectrum (Wu-Ouyang 2026 Framework) -->
        <div class="spectrum-container">
            <div class="spectrum-labels">
                <button class="spectrum-btn active" id="btnPhase1" onclick="updateUI(1)">High Algorithmic Agency<br>(Personalization)</button>
                <button class="spectrum-btn" id="btnPhase2" onclick="updateUI(2)">Hybrid Agency<br>(Personal Curation)</button>
                <button class="spectrum-btn" id="btnPhase3" onclick="updateUI(3)">High User Agency<br>(Customization)</button>
            </div>
            <div class="spectrum-bar">
                <div id="spectrumPointer" class="spectrum-pointer" style="left: 0%;"></div>
            </div>
        </div>
    </div>

    <div class="main-container">
        <!-- 海报卡片 -->
        <div class="card">
            <div class="poster-wrapper">
                <img id="posterImg" src="./phase1.jpg" alt="Phase Poster">
            </div>
            <!-- 音频更新为 mp3 以保证浏览器百分百播放兼容性 -->
            <audio id="audioPlayer" controls loop src="./audio1.mp3"></audio>
        </div>

        <!-- 学术文本卡片 -->
        <div class="card text-card">
            <div>
                <span id="statusBadge" class="status-badge">Phase I: Algorithmic Inundation</span>
                <h2 id="phaseTitle">Information Overload & Cognitive Exhaustion</h2>
            </div>

            <ul id="theoryList" class="theory-list">
                <!-- 动态渲染理论文本 -->
            </ul>

            <!-- 策展信号微控件 -->
            <div id="curationControls" class="curation-controls">
                <p style="font-size:0.75rem; color:#94a3b8; width:100%;">Emit Personal Curation Signals to Algorithm:</p>
                <button id="sigBtn1" class="signal-btn" onclick="emitSignal('sigBtn1', 'Block Signal Sent: Limiting Expansiveness')">[ Block Feed Signal ]</button>
                <button id="sigBtn2" class="signal-btn" onclick="emitSignal('sigBtn2', 'Attention Shifted: Reduced News Attentiveness')">[ Reduce News Attentiveness ]</button>
                <button id="sigBtn3" class="signal-btn" onclick="emitSignal('sigBtn3', 'Disconnected: Repertoire Pruned')">[ Multiplatform Disconnect ]</button>
                
                <!-- 信号叠加显示日志区 -->
                <div id="signalLog" class="signal-log-container"></div>
            </div>
        </div>
    </div>

    <script>
        const phases = {
            1: {
                badge: "Phase I: Algorithmic Inundation",
                badgeBg: "#7f1d1d",
                badgeColor: "#fca5a5",
                title: "Information Overload & Cognitive Exhaustion",
                btnText: "Switch to Phase II: Personal Curation",
                btnBg: "linear-gradient(135deg, #ef4444, #dc2626)",
                pointerLeft: "0%",
                pointerBg: "#ef4444",
                posterSrc: "./phase1.jpg",
                audioSrc: "./audio1.mp3", // 请确保把 audio1.wav 转成 mp3 上传
                showCuration: false,
                theories: [
                    { title: "Cognitive Load Theory (Sweller)", text: "High-density, continuous information streams overwhelm working memory capacity, leading to cognitive fatigue and emotional depletion." },
                    { title: "Attention Economy & Algorithmic Capture (Simon)", text: "Algorithmic recommendation feeds capture and exploit audience attention bandwidth through high-frequency emotional triggers." },
                    { title: "High Algorithmic Agency (Wu-Ouyang, 2026)", text: "The user remains a passive consumer under systemic personalization, with limited control over content sorting and feed exposure." }
                ]
            },
            2: {
                badge: "Phase II: Personal Curation Sanctuary",
                badgeBg: "#065f46",
                badgeColor: "#a7f3d0",
                title: "Active Avoidance as a Communicative Act",
                btnText: "Switch to Phase III: Full Customization",
                btnBg: "linear-gradient(135deg, #10b981, #059669)",
                pointerLeft: "33.33%",
                pointerBg: "#10b981",
                posterSrc: "./phase2.jpg",
                audioSrc: "./audio2.mp3",
                showCuration: true,
                theories: [
                    { title: "Personal Curation as Communicative Act (Wu-Ouyang, 2026)", text: "Unfriending, blocking, and hiding content are not mere passivity, but active signals sent to algorithmic and social curators to reshape feeds." },
                    { title: "Active News Avoidance & Limiting Curation (Skovsgaard; Wu-Ouyang)", text: "Refusing or limiting incoming information serves as a proactive defense strategy to guard psychological health and restore autonomy." },
                    { title: "Attention Restoration Theory (Kaplan)", text: "Reducing visual noise and engaging in minimal ambient soundscapes facilitates mental recovery and restores depleted cognitive bandwidth." }
                ]
            },
            3: {
                badge: "Phase III: Pure Customization & Sovereignty",
                badgeBg: "#1e3a8a",
                badgeColor: "#93c5fd",
                title: "Full User Agency: Digital Unplugging",
                btnText: "Reset to Phase I: Algorithmic Inundation",
                btnBg: "linear-gradient(135deg, #3b82f6, #1d4ed8)",
                pointerLeft: "66.66%",
                pointerBg: "#3b82f6",
                posterSrc: "./phase3.jpg",
                audioSrc: "./audio3.mp3",
                showCuration: false,
                theories: [
                    { title: "Full Customization (Sundar & Marathe; Wu-Ouyang, 2026)", text: "Represents maximum human agency where algorithms are completely bypassed, allowing complete user control over interface and content." },
                    { title: "Digital Sanctuary & Total Unplugging", text: "At maximum agency, the audience fully shapes their information environment, neutralizing algorithmic noise entirely." }
                ]
            }
        };

        let currentPhase = 1;
        let emittedCount = 0; // 已发射信号计数器

        const switchBtn = document.getElementById('switchBtn');
        const statusBadge = document.getElementById('statusBadge');
        const phaseTitle = document.getElementById('phaseTitle');
        const theoryList = document.getElementById('theoryList');
        const posterImg = document.getElementById('posterImg');
        const audioPlayer = document.getElementById('audioPlayer');
        const spectrumPointer = document.getElementById('spectrumPointer');
        const curationControls = document.getElementById('curationControls');
        const signalLog = document.getElementById('signalLog');

        function updateUI(phaseNum) {
            currentPhase = phaseNum;
            const data = phases[currentPhase];

            // 切换海报
            posterImg.style.opacity = 0;
            setTimeout(() => {
                posterImg.src = data.posterSrc;
                posterImg.style.opacity = 1;
            }, 150);

            // 切换音频
            audioPlayer.src = data.audioSrc;
            audioPlayer.load();
            audioPlayer.play().catch(err => {
                console.warn("Autoplay blocked by browser policy:", err);
            });

            // 更新文本
            statusBadge.textContent = data.badge;
            statusBadge.style.backgroundColor = data.badgeBg;
            statusBadge.style.color = data.badgeColor;
            phaseTitle.textContent = data.title;
            switchBtn.textContent = data.btnText;
            switchBtn.style.background = data.btnBg;

            spectrumPointer.style.left = data.pointerLeft;
            spectrumPointer.style.backgroundColor = data.pointerBg;

            document.querySelectorAll('.spectrum-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === phaseNum - 1);
            });

            // 切换阶段时重置/显示微控件
            curationControls.style.display = data.showCuration ? "flex" : "none";
            if (phaseNum !== 2) {
                resetSignalControls();
            }

            theoryList.innerHTML = data.theories.map(t => `
                <li>
                    <strong>${t.title}</strong>
                    ${t.text}
                </li>
            `).join('');
        }

        // 策展信号发射逻辑（叠加显示 + 自动跳转 Phase III）
        function emitSignal(btnId, msg) {
            const btn = document.getElementById(btnId);
            if (btn.classList.contains('disabled')) return;

            // 禁用已点击的按钮
            btn.classList.add('disabled');
            emittedCount++;

            // 叠加创建日志条目
            const logItem = document.createElement('div');
            logItem.className = 'signal-log-item';
            logItem.textContent = `✓ Signal ${emittedCount}: ${msg}`;
            signalLog.appendChild(logItem);

            // 当 3 个策展信号全被发射后，提示并自动跳转到 Phase III
            if (emittedCount >= 3) {
                const autoJumpNotice = document.createElement('div');
                autoJumpNotice.className = 'signal-log-item';
                autoJumpNotice.style.borderColor = '#38bdf8';
                autoJumpNotice.style.color = '#38bdf8';
                autoJumpNotice.style.fontWeight = 'bold';
                autoJumpNotice.textContent = "⚡ All curation signals sent! Transitioning to Full Agency...";
                signalLog.appendChild(autoJumpNotice);

                setTimeout(() => {
                    updateUI(3);
                }, 1500); // 1.5秒后自动跳转
            }
        }

        function resetSignalControls() {
            emittedCount = 0;
            signalLog.innerHTML = "";
            ['sigBtn1', 'sigBtn2', 'sigBtn3'].forEach(id => {
                const b = document.getElementById(id);
                if (b) b.classList.remove('disabled');
            });
        }

        switchBtn.addEventListener('click', () => {
            let nextPhase = currentPhase >= 3 ? 1 : currentPhase + 1;
            updateUI(nextPhase);
        });

        window.addEventListener('DOMContentLoaded', () => {
            updateUI(1);
        });
    </script>
</body>
</html>
