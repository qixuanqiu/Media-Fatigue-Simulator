<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Fatigue Simulator: From Inundation to Silence</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            max-width: 800px;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: #64748b;
            font-size: 0.95rem;
        }

        /* 控制栏 & Agency Spectrum */
        .control-panel {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 25px;
        }

        .switch-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }

        .switch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4);
        }

        /* Agency Spectrum Indicator */
        .spectrum-container {
            width: 100%;
            max-width: 800px;
            background-color: #0f172a;
            border-radius: 8px;
            padding: 10px 14px;
            border: 1px solid #334155;
        }

        .spectrum-labels {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .spectrum-btn {
            background-color: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 8px 4px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            line-height: 1.3;
        }

        .spectrum-btn:hover {
            background-color: #334155;
            color: #f8fafc;
            border-color: #64748b;
        }

        .spectrum-btn.active {
            color: #ffffff;
            font-weight: 600;
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.2);
        }

        .spectrum-bar {
            height: 6px;
            background-color: #334155;
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }

        .spectrum-pointer {
            position: absolute;
            top: 0;
            width: 33.33%;
            height: 100%;
            background: #ef4444;
            border-radius: 3px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 主内容容器 */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            width: 100%;
            max-width: 1100px;
        }

        @media (max-width: 850px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 海报高度锁死 */
        .poster-wrapper {
            height: 500px;
            width: 100%;
            background-color: #000000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #334155;
        }

        .poster-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.3s ease;
        }

        .text-card h2 {
            font-size: 1.4rem;
            color: #f8fafc;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            background-color: #7f1d1d;
            color: #fca5a5;
            margin-bottom: 10px;
        }

        .theory-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #cbd5e1;
        }

        .theory-list li strong {
            color: #38bdf8;
            display: block;
            margin-bottom: 2px;
        }

        audio {
            width: 100%;
            margin-top: auto;
            border-radius: 6px;
        }

        /* 策展交互微控件 (仅 Phase II 显示) */
        .curation-controls {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #334155;
